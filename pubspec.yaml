name: lava_fortune_game
description: "Volcanic drilling arcade — pick a tunnel, manage heat, and extract loot before the magma takes you."
publish_to: 'none'
version: 1.0.3+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1

  # ── Relay flow stack ──
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.13.0
  connectivity_plus: ^7.1.1
  appsflyer_sdk: ^6.18.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  firebase_app_check: ^0.4.5
  flutter_local_notifications: ^22.0.1
  flutter_secure_storage: ^10.3.1
  device_info_plus: 11.4.0
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.8.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/generated/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  # Foreground PNG already occupies 74 dp of the 108 dp canvas — do not inset again.
  adaptive_icon_background: "#C45A18"
  adaptive_icon_foreground: "assets/generated/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true

  assets:
    - assets/Lava_Fortune_gameplay_assets/
    - assets/Lava_Fortune_additional_assets/
    - assets/Lava_Fortune_sounds_assets/
    - assets/images/sliced/
